<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/events.js"></script>
    <script src="assets/film.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #09090a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" width="1920" height="1080" data-start="0" data-duration="42" data-track-index="0" data-layout-allow-overflow></canvas>
      <audio id="score" src="assets/score-cut.wav" data-start="0" data-duration="42" data-track-index="5"></audio>
    </div>
    <script>
      const film = createPunctumFilm();
      const ctx = document.getElementById("stage").getContext("2d");
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 42, duration: 42, ease: "none", onUpdate: () => film.draw(ctx, clock.t) }, 0);
      window.__timelines["main"] = tl;
      film.draw(ctx, 0);
    </script>
  </body>
</html>
