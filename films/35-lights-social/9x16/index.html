<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // 32 s social cut of PUNCTUM // 35 LIGHTS: 1 s countdown hook (src 19–20) → src 30–60
      window.PUNCTUM_SECTIONS = [[0, "T-MINUS"], [20, "01 ROUND / PIXEL"], [34, "02 MATERIALS"], [48, "03 35 LIGHTS"], [56, "04 PUNCTUM"]];
      window.PUNCTUM_W = 1080; window.PUNCTUM_H = 1920;
      window.CUT = [[0, 1, 19], [1, 31, 30]]; // [filmStart, filmEnd, sourceIn]
    </script>
    <script src="assets/events.js"></script>
    <script src="assets/film.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #09090a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" width="1080" height="1920" data-start="0" data-duration="31" data-track-index="0" data-layout-allow-overflow></canvas>
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="31" data-track-index="5"></audio>
    </div>
    <script>
      const film = createPunctumFilm();
      const ctx = document.getElementById("stage").getContext("2d");
      function draw(t) {
        const seg = window.CUT.find(([a, b]) => t >= a && t < b) || window.CUT[window.CUT.length - 1];
        const src = Math.min(seg[2] + (t - seg[0]), 59.999);
        window.PUNCTUM_TC_OFF = src - t;
        film.draw(ctx, src);
      }
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 31, duration: 31, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      draw(0);
    </script>
  </body>
</html>
